name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Enable ICMP datagram sockets
        if: runner.os == 'Linux'
        run: sudo sysctl -w 'net.ipv4.ping_group_range=0 2147483647'
      - name: Vet and test
        env:
          XRAY_REQUIRE_ICMP: "1"
        shell: bash
        run: |
          race=-race # needs cgo on Windows, which the runner doesn't set up
          if [ "$RUNNER_OS" = "Windows" ]; then race=; fi
          sh scripts/test-modules.sh $race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Build every OS and architecture
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - name: Build with patched Xray
        run: sh scripts/with-xray.sh goreleaser release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: masir-snapshot
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/checksums.txt
          retention-days: 7
