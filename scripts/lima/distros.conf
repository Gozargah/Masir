# The Linux guests `make lima-test` boots. One per line, tab separated:
#
#   name  template  vm-type  flags
#
# vm-type is "auto" (Lima's default: Virtualization.framework on macOS, QEMU on Linux)
# or "qemu". flags may be empty; "qemu-required" skips the guest when the QEMU binary
# for this host architecture is missing.
#
# The Arch aarch64 cloud image does not boot under Virtualization.framework, so the
# arch guest is pinned to QEMU.
ubuntu	template:ubuntu	auto
arch	template:archlinux	qemu	qemu-required
fedora	template:fedora	auto	selinux
